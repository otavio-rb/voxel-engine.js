<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Photorealistic 3D Tiles - Visualização Completa (CesiumJS)</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #ui-panel {
      position: absolute; top: 16px; left: 16px; z-index: 99;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 20px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      max-width: 360px;
    }
    h2 { margin: 0 0 6px 0; font-size: 17px; font-weight: 700; color: #60a5fa; }
    p { margin: 0 0 14px 0; font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    .loc-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .loc-btn:hover, .loc-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
    }
    .badge {
      font-size: 11px;
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }
    #status-badge {
      position: absolute; bottom: 20px; left: 20px; z-index: 99;
      background: rgba(15, 23, 42, 0.85); color: #4ade80;
      padding: 8px 14px; border-radius: 20px; font-size: 12px;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
  </style>
</head>
<body>
  <div id="ui-panel">
    <h2>Google 3D Tiles • Modelo Contínuo Real</h2>
    <p>Visualização fotogramétrica 100% original (sem voxels), com streaming contínuo oficial de malhas, texturas, esplanadas e vazios arquitetônicos.</p>
    <div class="btn-group">
      <button class="loc-btn active" id="btn-congresso">
        <span>🏛️ Congresso Nacional</span>
        <span class="badge">Brasília</span>
      </button>
      <button class="loc-btn" id="btn-masp">
        <span>🏢 MASP & Av. Paulista</span>
        <span class="badge">São Paulo</span>
      </button>
      <button class="loc-btn" id="btn-cristo">
        <span>⛰️ Cristo Redentor</span>
        <span class="badge">Rio de Janeiro</span>
      </button>
      <button class="loc-btn" id="btn-trianon">
        <span>🌳 Parque Trianon</span>
        <span class="badge">Mata Atlântica</span>
      </button>
    </div>
  </div>
  <div id="status-badge">Carregando Google 3D Tiles...</div>
  <div id="cesiumContainer"></div>

  <script type="module">
    // Get API Key from Vite env or parameter
    const params = new URLSearchParams(window.location.search);
    const key = params.get('key') || import.meta.env.VITE_GOOGLE_MAPS_API_KEY || '';
    const statusEl = document.getElementById('status-badge');

    // Desativa ion token warning
    Cesium.Ion.defaultAccessToken = '';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      globe: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: true,
      infoBox: false,
      selectionIndicator: false,
      terrain: undefined
    });

    // Melhora qualidade visual e iluminação
    viewer.scene.fog.enabled = true;
    viewer.scene.fog.density = 0.00015;
    viewer.scene.sun.show = true;
    viewer.scene.moon.show = false;

    const LOCATIONS = {
      congresso: {
        dest: Cesium.Cartesian3.fromDegrees(-47.8680, -15.7997, 1260),
        orientation: {
          heading: Cesium.Math.toRadians(90.0), // Olhando para o Leste (Torres Gêmeas e Cúpulas)
          pitch: Cesium.Math.toRadians(-22.0),
          roll: 0.0
        }
      },
      masp: {
        dest: Cesium.Cartesian3.fromDegrees(-46.6578, -23.5605, 960),
        orientation: {
          heading: Cesium.Math.toRadians(128.0), // Olhando para o MASP e Av. Paulista
          pitch: Cesium.Math.toRadians(-24.0),
          roll: 0.0
        }
      },
      cristo: {
        dest: Cesium.Cartesian3.fromDegrees(-43.210487, -22.9555, 900),
        orientation: {
          heading: Cesium.Math.toRadians(0.0), // Olhando para o Norte em direção ao Cristo
          pitch: Cesium.Math.toRadians(-18.0),
          roll: 0.0
        }
      },
      trianon: {
        dest: Cesium.Cartesian3.fromDegrees(-46.6585, -23.5620, 980),
        orientation: {
          heading: Cesium.Math.toRadians(115.0),
          pitch: Cesium.Math.toRadians(-28.0),
          roll: 0.0
        }
      }
    };

    async function init() {
      try {
        statusEl.textContent = 'Conectando à API Google Photorealistic 3D Tiles...';
        const tileset = await Cesium.Cesium3DTileset.fromUrl(
          `https://tile.googleapis.com/v1/3dtiles/root.json?key=${key}`,
          {
            skipLevelOfDetail: true,
            maximumScreenSpaceError: 16
          }
        );
        viewer.scene.primitives.add(tileset);

        statusEl.textContent = '✓ Google 3D Tiles conectado - Transmitindo malhas 3D originais';
        setTimeout(() => { statusEl.style.opacity = '0.7'; }, 4000);

        const target = params.get('target') || 'congresso';
        flyTo(target);

      } catch (err) {
        console.error('Erro Cesium 3D Tiles:', err);
        statusEl.style.color = '#ef4444';
        statusEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        statusEl.textContent = 'Erro ao carregar Google 3D Tiles: ' + err.message;
      }
    }

    function flyTo(locKey) {
      const loc = LOCATIONS[locKey] || LOCATIONS.congresso;
      viewer.camera.flyTo({
        destination: loc.dest,
        orientation: loc.orientation,
        duration: 2.2
      });
      document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + locKey)?.classList.add('active');
    }

    document.getElementById('btn-congresso')?.addEventListener('click', () => flyTo('congresso'));
    document.getElementById('btn-masp')?.addEventListener('click', () => flyTo('masp'));
    document.getElementById('btn-cristo')?.addEventListener('click', () => flyTo('cristo'));
    document.getElementById('btn-trianon')?.addEventListener('click', () => flyTo('trianon'));

    window.flyTo = flyTo;
    window.viewer = viewer;

    init();
  </script>
</body>
</html>
