<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21.200 -21.200 42.400 42.400" shape-rendering="geometricPrecision">
  <style>
    .vxl-cube { animation: vxl-pop 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .vxl-a { animation-delay: 0.0s; }
    .vxl-b { animation-delay: 0.15s; }
    .vxl-c { animation-delay: 0.3s; }
    .vxl-d { animation-delay: 0.45s; }
    .vxl-e { animation-delay: 0.6s; }
    .vxl-f { animation-delay: 0.75s; }
    .vxl-g { animation-delay: 0.9s; }
    @keyframes vxl-pop {
      0%, 60%, 100% { transform: scale(1); opacity: 1; }
      30% { transform: scale(0.55); opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .vxl-cube { animation: none; }
    }
  </style>
  <g class="vxl-cube vxl-a">
    <polygon points="0.000,-10.000 8.660,-5.000 0.000,0.000 -8.660,-5.000" fill="#7BE38A"/>
    <polygon points="-8.660,5.000 0.000,10.000 0.000,0.000 -8.660,-5.000" fill="#B07A4A"/>
    <polygon points="8.660,5.000 0.000,10.000 0.000,0.000 8.660,-5.000" fill="#7E5232"/>
  </g>
  <g class="vxl-cube vxl-b">
    <polygon points="-8.660,-5.000 0.000,0.000 -8.660,5.000 -17.321,0.000" fill="#6AD47A"/>
    <polygon points="-17.321,10.000 -8.660,15.000 -8.660,5.000 -17.321,0.000" fill="#9E6B3F"/>
    <polygon points="0.000,10.000 -8.660,15.000 -8.660,5.000 0.000,0.000" fill="#70482B"/>
  </g>
  <g class="vxl-cube vxl-c">
    <polygon points="8.660,-5.000 17.321,0.000 8.660,5.000 0.000,0.000" fill="#6AD47A"/>
    <polygon points="0.000,10.000 8.660,15.000 8.660,5.000 0.000,0.000" fill="#9E6B3F"/>
    <polygon points="17.321,10.000 8.660,15.000 8.660,5.000 17.321,0.000" fill="#70482B"/>
  </g>
  <g class="vxl-cube vxl-d">
    <polygon points="0.000,-20.000 8.660,-15.000 0.000,-10.000 -8.660,-15.000" fill="#6AD47A"/>
    <polygon points="-8.660,-5.000 0.000,0.000 0.000,-10.000 -8.660,-15.000" fill="#9E6B3F"/>
    <polygon points="8.660,-5.000 0.000,0.000 0.000,-10.000 8.660,-15.000" fill="#70482B"/>
  </g>
  <g class="vxl-cube vxl-e">
    <polygon points="0.000,0.000 8.660,5.000 0.000,10.000 -8.660,5.000" fill="#7BE38A"/>
    <polygon points="-8.660,15.000 0.000,20.000 0.000,10.000 -8.660,5.000" fill="#B07A4A"/>
    <polygon points="8.660,15.000 0.000,20.000 0.000,10.000 8.660,5.000" fill="#7E5232"/>
  </g>
  <g class="vxl-cube vxl-f">
    <polygon points="-8.660,-15.000 0.000,-10.000 -8.660,-5.000 -17.321,-10.000" fill="#7BE38A"/>
    <polygon points="-17.321,0.000 -8.660,5.000 -8.660,-5.000 -17.321,-10.000" fill="#B07A4A"/>
    <polygon points="0.000,0.000 -8.660,5.000 -8.660,-5.000 0.000,-10.000" fill="#7E5232"/>
  </g>
  <g class="vxl-cube vxl-g">
    <polygon points="8.660,-15.000 17.321,-10.000 8.660,-5.000 0.000,-10.000" fill="#7BE38A"/>
    <polygon points="0.000,0.000 8.660,5.000 8.660,-5.000 0.000,-10.000" fill="#B07A4A"/>
    <polygon points="17.321,0.000 8.660,5.000 8.660,-5.000 17.321,-10.000" fill="#7E5232"/>
  </g>
</svg>
